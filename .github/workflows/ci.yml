name: CI
# Push em qualquer branch, menos as dependabot/** (o Dependabot cria a branch no próprio repositório e abre o PR: sem o
# filtro, cada PR dele rodaria o CI duas vezes), e todo pull_request.
on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Histórico completo: tests/lastmod.test.mjs calcula o lastmod do sitemap.xml pelo git log e falha em clone raso.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: html-validate
        run: find . -name '*.html' -not -path './.git/*' -not -path './tests/*' -not -path '*/node_modules/*' -not -name 'google*.html' -print0 | xargs -0 npx --yes html-validate@9.7.1 --max-warnings 0 -c .htmlvalidate.json
      - name: Testes (node --test)
        run: node --test 'tests/*.test.mjs'
      # zizmor 1.30.1 (PyPI, versão exata de 09/09/2026) num venv, com o sha256 do wheel manylinux x86_64 conferido pelo
      # pip (--require-hashes), offline e sem token, em .github/ (workflows e dependabot.yml). Falha com achado do perfil
      # padrão: action por tag ou branch em vez de SHA, checkout sem persist-credentials: false, workflow sem permissions
      # ou com escrita no nível do workflow, ${{ }} de entrada externa dentro de run, dependabot.yml sem cooldown. Não
      # confere o comentário da versão ao lado do SHA, permissions de escrita no nível do job nem persist-credentials:
      # true explícito: isso fica para a revisão (README). Fora do Dependabot: versão e hash sobem à mão.
      - name: zizmor (segurança dos workflows)
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          echo 'zizmor==1.30.1 --hash=sha256:eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e' >"$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline --no-progress .github
  # Lighthouse 13.5.0 (npx, versão fixa; o @lhci/cli embute o 12.6, sem a categoria agentic-browsing) contra o site
  # servido localmente. Metas em tests/lighthouse/metas.mjs: SEO >= 0,95, Acessibilidade >= 0,95, CLS < 0,1 e o audit
  # llms-txt. O banner de cookies nunca é aceito e as URLs do Google Analytics ficam bloqueadas.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Lighthouse 13.5.0 (9 URLs, mobile e desktop) e metas
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >"$RUNNER_TEMP/http.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          node tests/lighthouse/rodar.mjs --base http://127.0.0.1:8080 --saida "$RUNNER_TEMP/lighthouse"
      - name: Relatórios do Lighthouse
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse
          path: ${{ runner.temp }}/lighthouse
          if-no-files-found: ignore
          retention-days: 7
  # Testes de navegador (tests/e2e, Playwright com versão exata no package-lock.json, só Chromium): cada calculadora
  # envia o formulário com os valores padrão e mostra resultado; home e blog carregam sem erro; nada do Google antes
  # do aceite do banner nem depois de Recusar, e a tentativa de carregar o GA só aparece depois de Aceitar; e o axe-core
  # (@axe-core/playwright, versão do lock) em todas as páginas, nas duas larguras e nos temas claro e escuro, que falha
  # com violação serious ou critical das regras WCAG 2.0, 2.1 e 2.2 A e AA. O próprio Playwright serve o site com
  # python3 -m http.server em 127.0.0.1 e aborta toda requisição a outro host.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Dependências (npm ci, versão exata do lockfile)
        working-directory: tests/e2e
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Chromium (headless shell) com as dependências do sistema
        working-directory: tests/e2e
        run: npx playwright install --with-deps --only-shell chromium
      - name: Testes de navegador (390 px e 1280 px)
        working-directory: tests/e2e
        run: npx playwright test
      - name: Capturas e traces das falhas
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-falhas
          path: tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
