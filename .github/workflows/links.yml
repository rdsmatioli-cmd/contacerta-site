name: Links externos
# Checagem semanal dos links externos (tests/links/conferir-links.mjs, Node 22, sem dependências): segunda-feira às
# 09:17 UTC (minuto quebrado, fora do pico da hora cheia) e sob demanda. Não roda em push nem em PR: depende de sites
# de terceiros, que caem e voltam sem relação com o código. Falha só com link QUEBRADO; bloqueio de robô é aviso.
# O resumo, com cada link quebrado e as páginas onde aparece, fica na página da execução.
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Conferir links externos
        run: node tests/links/conferir-links.mjs
