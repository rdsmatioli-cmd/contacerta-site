# Dependabot: atualizações de versão das actions dos workflows e das dependências do e2e (tests/e2e) e dos testes por
# propriedade (tests/oraculo). Uma vez por mês (dia 1, 06:00 de Brasília) e só com versão publicada há pelo menos 14
# dias (cooldown): poucos PRs e nada recém-publicado. Em cada ecossistema, minor e patch vêm num PR agrupado e o
# major de cada dependência em PR próprio (um major que quebre o CI não trava o resto); no máximo 3 PRs abertos por
# ecossistema. A primeira verificação costuma rodar logo que este arquivo chega à main, sem esperar o dia 1. Merge
# manual, com o CI verde. Sem labels próprios: valem os do Dependabot. As versões fixadas dentro de run no ci.yml
# (zizmor, html-validate, Lighthouse) ficam fora: sobem à mão. Alertas e atualizações de segurança são opção do
# repositório (Settings > Advanced Security), fora deste arquivo.
version: 2
updates:
  # Actions fixadas por SHA completo em .github/workflows/: o PR troca o SHA e o comentário da versão juntos. Minor e
  # patch num PR só; major (por exemplo actions/checkout v6 -> v7), em PR separado.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  # @playwright/test e @axe-core/playwright, com versão exata no package.json e no package-lock.json. Minor e patch
  # vêm num PR só; major, em PR separado.
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: monthly
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    commit-message:
      prefix: testes
    groups:
      e2e:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  # fast-check dos testes por propriedade das fórmulas (tests/oraculo), com versão exata no package.json e no
  # package-lock.json. Minor e patch vêm num PR só; major, em PR separado.
  - package-ecosystem: npm
    directory: /tests/oraculo
    schedule:
      interval: monthly
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    commit-message:
      prefix: testes
    groups:
      oraculo:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
